name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # Setup Java for backend
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build backend with Maven
      run: mvn -B package --file backend/pom.xml -DskipTests

    # Setup Node for frontend
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Build frontend with Node
      run: |
        cd frontend
        npm install
        npm run build

    # Install Docker Compose
    - name: Install Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.23.3/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version

    # Docker login
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build and push images
    - name: Build and Push Docker images
      run: |
        docker-compose build
        docker tag lms-fullstack-main-backend ${{ secrets.DOCKER_USERNAME }}/lms-backend:latest
        docker tag lms-fullstack-main-frontend ${{ secrets.DOCKER_USERNAME }}/lms-frontend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/lms-backend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/lms-frontend:latest
